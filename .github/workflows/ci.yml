name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q cli.py gui.py core platforms

      - name: Smoke test imports and version
        run: |
          python cli.py --version
          python -c "import cli"
          python -c "import gui"
          python -c "print(__import__('core').__version__)"
